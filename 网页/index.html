<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>关系图谱 · 知乎知识库</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/lib/hljs-light.css" id="hljs-light" />
<link rel="stylesheet" href="/lib/hljs-dark.css" id="hljs-dark" disabled />
<link rel="stylesheet" href="/lib/katex.min.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body class="sidebar-open">
<div id="progress"></div>
<div class="layout">
  <nav class="ribbon" aria-label="工作区工具">
    <button class="icon-btn" id="btn-sidebar" title="切换文件列表" aria-label="切换文件列表" aria-expanded="true" aria-controls="sidebar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="ribbon-divider"></div>
    <button class="icon-btn" id="btn-graph" title="关系图谱" aria-label="关系图谱" aria-current="page"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="11" cy="18" r="2.5"/><path d="m8.5 6.2 7 .6M7 8.4l3 7M16.6 9.1l-4.2 6.6"/></svg></button>
    <button class="icon-btn" id="search-trigger" title="搜索笔记（Ctrl K）" aria-label="搜索笔记（Ctrl K）" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    <button class="icon-btn" id="btn-tags" title="浏览所有标签" aria-label="浏览所有标签" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13 13 20a2 2 0 0 1-3 0l-7-7V3h10l7 7a2 2 0 0 1 0 3Z"/><circle cx="7.5" cy="7.5" r="1"/></svg></button>
    <div class="ribbon-spacer"></div>
    <button class="icon-btn" id="btn-rescan" title="重新扫描笔记库" aria-label="重新扫描笔记库" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 7M20 4v6h-6"/></svg></button>
    <button class="icon-btn" id="btn-theme" title="切换明暗主题" aria-label="切换明暗主题" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg></button>
  </nav>

  <aside class="sidebar" id="sidebar" aria-label="文件列表">
    <div class="sidebar-toolbar">
      <span class="sidebar-toolbar-title"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 10h18"/></svg> 文件</span>
      <button class="icon-btn" id="btn-collapse-tree" title="折叠或展开全部文章" aria-label="折叠或展开全部文章" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 8 5-5 5 5M7 16l5 5 5-5"/></svg></button>
    </div>
    <div class="vault-title">知乎知识库 <span class="vault-local">本地</span></div>
    <button class="tree-home active" id="btn-home"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="11" cy="18" r="2.5"/><path d="m8.5 6.2 7 .6M7 8.4l3 7M16.6 9.1l-4.2 6.6"/></svg><span>关系图谱</span></button>
    <div class="sidebar-head"><span>收藏夹</span><span id="sidebar-count"></span></div>
    <nav class="tree" id="tree" aria-label="笔记文件"></nav>
    <div class="sidebar-footer"><span class="vault-dot"></span><span>知乎收藏夹</span><span class="muted" id="brand-sub"></span></div>
  </aside>
  <div class="resizer" id="resizer-1" role="separator" tabindex="0" aria-label="调整文件列表宽度" aria-orientation="vertical"></div>

  <main class="workspace">
    <nav class="workspace-tabs" aria-label="已打开的视图">
      <button class="workspace-tab graph-tab active" id="tab-graph" title="回到完整图谱"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="11" cy="18" r="2.5"/><path d="m8.5 6.2 7 .6M7 8.4l3 7M16.6 9.1l-4.2 6.6"/></svg><span>关系图谱</span><span class="tab-pin">固定</span></button>
      <div class="workspace-tab note-tab" id="tab-note" hidden>
        <button class="note-tab-title" id="tab-note-title"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H5v18h14V8Z"/><path d="M14 3v5h5M8 12h8M8 16h6"/></svg><span id="tab-note-label"></span></button>
        <button class="icon-btn" id="btn-close-note" title="关闭阅读面板" aria-label="关闭阅读面板" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
      <div class="tabs-spacer"></div>
      <button class="quick-search" id="btn-quick-search" title="搜索笔记"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>搜索</span><kbd>Ctrl K</kbd></button>
    </nav>

    <div class="workspace-panes" id="workspace-panes">
      <section class="graph-panel" id="graph-panel" aria-label="关系图谱">
        <header class="pane-header">
          <div class="pane-heading"><h1>关系图谱</h1><span id="graph-count" class="muted"></span></div>
          <button class="icon-btn" id="btn-graph-list" title="查找图谱节点" aria-label="查找图谱节点" aria-expanded="false" aria-controls="graph-node-list"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"/></svg></button>
        </header>
        <div class="graph-stage" id="graph-stage">
          <canvas id="graph-canvas" tabindex="0" role="group" aria-label="可交互关系图谱" aria-describedby="graph-instructions">可通过“查找图谱节点”列表打开每个节点。</canvas>
          <div class="graph-state" id="graph-message" role="status">
            <div class="graph-state-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="11" cy="18" r="2.5"/><path d="m8.5 6.2 7 .6M7 8.4l3 7M16.6 9.1l-4.2 6.6"/></svg></div>
            <h2 id="graph-message-title">正在载入图谱</h2>
            <p id="graph-message-detail">连接文章、分节与概念…</p>
            <button class="text-btn" id="btn-graph-retry" hidden>重新加载</button>
          </div>
          <div class="graph-tooltip" id="graph-tooltip" role="tooltip" hidden></div>
          <section class="graph-node-list" id="graph-node-list" aria-label="查找图谱节点" hidden>
            <div class="graph-find-input"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="graph-node-filter" type="search" placeholder="查找节点…" aria-label="按标题查找节点" autocomplete="off" /><button class="icon-btn" id="btn-close-node-list" title="关闭节点列表" aria-label="关闭节点列表" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
            <div class="node-list-caption" id="graph-node-count" aria-live="polite"></div>
            <div class="graph-node-results" id="graph-node-results"></div>
          </section>
          <div class="graph-legend" aria-label="节点图例"><span><i class="legend-article"></i>文章</span><span><i class="legend-section"></i>分节</span><span><i class="legend-concept"></i>概念</span><span><i class="legend-tag"></i>标签</span></div>
          <div class="graph-controls" aria-label="图谱视图控制">
            <button class="icon-btn" id="btn-zoom-out" title="缩小图谱" aria-label="缩小图谱" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><output id="graph-zoom" aria-label="缩放比例">100%</output><button class="icon-btn" id="btn-zoom-in" title="放大图谱" aria-label="放大图谱" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <span class="control-divider"></span><button class="icon-btn" id="btn-graph-fit" title="适应全部节点（Home）" aria-label="适应全部节点（Home）" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="graph-instructions" id="graph-instructions">单击节点打开 · 拖动空白平移 · 滚轮缩放<span class="sr-only">。方向键选择节点，Enter 打开，Home 适应全部节点。</span></p>
          <span class="sr-only" id="graph-announcement" aria-live="polite"></span>
        </div>
      </section>

      <div class="resizer reader-resizer" id="resizer-2" role="separator" tabindex="0" aria-label="调整阅读面板宽度" aria-orientation="vertical" hidden></div>
      <section class="reader" id="reader" aria-label="笔记阅读面板" tabindex="-1" hidden>
        <header class="pane-header reader-header">
          <span class="reader-heading" id="reader-kind">笔记预览</span>
          <div class="reader-tools">
            <button class="icon-btn" id="btn-reader-details" title="大纲与关联信息" aria-label="大纲与关联信息" aria-expanded="false" aria-controls="rail"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h12M9 12h12M9 19h12M3 5h.01M3 12h.01M3 19h.01"/></svg></button>
            <button class="icon-btn" id="btn-reader-expand" title="展开阅读" aria-label="展开阅读" aria-pressed="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M21 3l-7 7M10 21H3v-7M3 21l7-7"/></svg></button>
            <button class="icon-btn" id="btn-reader-close" title="关闭阅读面板，返回图谱" aria-label="关闭阅读面板，返回图谱" ><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
          </div>
        </header>
        <div class="reader-layout">
          <div class="content" id="content">
            <section class="reader-message" id="reader-message" role="status" hidden></section>
            <article class="note" id="note" hidden>
              <div class="note-head" id="note-head"></div>
              <div class="note-body markdown-body" id="note-body"></div>
              <div class="note-foot" id="note-foot"></div>
            </article>
            <section class="tag-view" id="tag-view" hidden><div id="tag-head"></div><div id="tag-notes"></div></section>
          </div>
          <aside class="rail" id="rail" aria-label="大纲与关联信息" hidden>
            <section class="rail-section" id="sec-meta"></section>
            <section class="rail-section" id="sec-toc"><div class="rail-title">大纲</div><div class="toc" id="toc"></div></section>
            <section class="rail-section" id="sec-related"><div class="rail-title">相关笔记</div><div class="link-list" id="related"></div></section>
            <section class="rail-section" id="sec-backlink"><div class="rail-title">反向链接</div><div class="link-list" id="backlinks"></div></section>
          </aside>
        </div>
      </section>
    </div>
  </main>
</div>
<footer class="statusbar"><span id="status-left">正在读取本地知识库…</span><span id="status-right">本地知识库</span></footer>

<div class="overlay hidden" id="ov-search" role="dialog" aria-modal="true" aria-label="搜索笔记">
  <div class="palette">
    <div class="palette-input"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search-input" placeholder="搜索标题、正文、标签、作者…" aria-label="搜索笔记" autocomplete="off" spellcheck="false" /><kbd>Esc</kbd></div>
    <div class="palette-results" id="search-results"></div>
  </div>
</div>
<div class="overlay hidden" id="ov-tags" role="dialog" aria-modal="true" aria-label="所有标签">
  <div class="modal"><div class="modal-head"><span>所有标签</span><button class="icon-btn close" data-close aria-label="关闭标签"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div class="tag-cloud" id="tag-cloud"></div></div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/lib/marked.min.js"></script>
<script src="/lib/purify.min.js"></script>
<script src="/lib/highlight.min.js"></script>
<script src="/lib/katex.min.js"></script>
<script src="/lib/auto-render.min.js"></script>
<script src="/graph.js"></script>
<script src="/app.js"></script>
</body>
</html>
